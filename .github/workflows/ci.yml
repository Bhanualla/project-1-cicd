name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v


      - name: Install security scanner
        run: pip install pip-audit

      - name: Run dependency security scan
        run: pip-audit -r requirements.txt

      - name: Run code quality checks
        run: ruff check .

      - name: Install security scanner
        run: pip install pip-audit

      - name: Run dependency security scan
        run: pip-audit -r requirements.txt

      - name: Install Bandit
        run: pip install bandit

      - name: Run source code security scan
        run: bandit app.py

      - name: Build Docker Image
        run: docker build -t employee-portal:1.2 .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
           docker tag employee-portal:1.2 ghcr.io/${GITHUB_REPOSITORY,,}/employee-portal:1.2
           docker push ghcr.io/${GITHUB_REPOSITORY,,}/employee-portal:1.2